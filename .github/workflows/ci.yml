# Game Watcher — kontrola kvality při každém push a pull requestu
#
# Stejné kontroly jako lokálně před commitem (docs/CODING_GUIDELINES.md, sekce 9):
# Pint, PHPStan, Pest proti MariaDB 11.4 jako na produkci a build assetů.
#
# @author Roman Hlaváček
# @created 2026-10-11

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Starší běh téže větve je po novém push k ničemu
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (Pint, PHPStan, Pest)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: games_test
          MARIADB_USER: games
          MARIADB_PASSWORD: games
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Přebije DB_HOST=db z phpunit.xml (tam jen jako výchozí hodnota) a .env
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: games_test
      DB_USERNAME: games
      DB_PASSWORD: games

    steps:
      - uses: actions/checkout@v4

      # Verze a rozšíření jako docker/php/Dockerfile a produkce (PHP 8.4)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, bcmath, zip
          coverage: none

      - name: Cache Composeru
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Příprava .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: ./vendor/bin/pest

  assets:
    name: Build assetů
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node jako v kontejneru (Alpine, docker/php/Dockerfile)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build
