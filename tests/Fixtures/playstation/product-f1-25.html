__typename":"Description","type":"LONG","value":"Hunt: Showdown 1896 is a new era of the addictively unforgiving extraction shooter. In corrupted backwaters lost to history, fight back alone – or with friends – against timeless evil. Twisted monsters and other ruthless Hunters stand between you and your Bounty. Risk everything as Hunt consumes you.<br/><br/>Bounty Hunt: Take rich bounties and kill anyone that tries to stop you – and they will try. Race competing Hunters to track down bosses, send them to hell, claim their bounty, and fight your way to extract. If others only slow you down, go alone. If you find strength in numbers, take up to two teammates along.<br/><br/>Progression and Permadeath: Risk everything to unlock dark powers and forbidden wealth. Every bullet counts. Every wound hurts. And every death is permanent. But if you succeed, every victory will be unforgettable.<br/><br/>Atmosphere and Sound Design: Hear footsteps squelch in the mud as you wait with bated breath to strike. The world speaks. Every gunshot is a message; every howling dog a klaxon. Gramophones murmur with the haunting melodies of Port Sulphur Band. Listen, and you might live to die another day.<br/><br/>Constantly Evolving Game: Keep striving for more, the world is always growing. Frequent updates challenge you with new Events, expand your arsenal of weapons, introduce new characters, and offer the chance to get ornate rewards. Join the thriving Hunt community, stay informed, and get an edge over the Corruption.<br/>"},{"__typename":"Description","type":"COMPATIBILITY_NOTICE","value":"PS Plus required for online play<br/>Supports up to 12 online players with PS Plus<br/>In-game purchases optional<br/>Online play required<br/>PS5 Pro Enhanced<br/>Remote Play supported<br/>DUALSHOCK 4 vibration"},{"__typename":"Description","type":"LEGAL","value":"<br><br>Download of this product is subject to the PlayStation Terms of Service and our Software Usage Terms plus any specific additional
