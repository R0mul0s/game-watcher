,"name":"Standard Edition"},"name":"SILENT HILL 2","descriptions":[{"__typename":"Description","type":"SHORT","value":"\"My name...is Maria,\" the woman smiles, just like my late wife."},{"__typename":"Description","type":"LONG","value":"Having received a letter from his deceased wife,<br/>James heads to where they shared so many memories,<br/>in the hope of seeing her one more time: Silent Hill.<br/>There, by the lake, he finds a woman eerily similar to her...<br/><br/>\"My name...is Maria,\" the woman smiles. Her face, her voice... She's just like her.<br/><br/>Experience a master-class in psychological survival horror―lauded as the best in the series―on the latest hardware with chilling visuals and visceral sounds.<br/><br/>High-end Graphics and Sound<br/><br/>With ray tracing and other cutting-edge technical enhancements, the world of SILENT HILL and its unsettling ambiance is even realer than before.<br/>And with the inclusion of new, immersive soundscapes, you'll feel like you're standing in the thick of it.<br/><br/>Larger Environments<br/><br/>Explore locations and buildings that were once inaccessible, or are newly added in the remake.<br/>Enjoy the same acclaimed story, even while you experience the town of Silent Hill with fresh eyes across an expanded map.<br/><br/>Over-the-shoulder Camera<br/><br/>The remake moves from the original's fixed-camera viewpoints to an over-the-shoulder perspective, putting you closer to what James sees, for a more thrilling, more immersive experience as you explore the town and come face-to-face with monsters.<br/><br/>Evolved Combat Gameplay<br/><br/>Familiar weapons like the steel pipe and handgun make their return, but now with an updated combat system.<br/>Avoid attacks with carefully timed dodges, aim down sights, and more, making monster encounters more engaging and nerve-wracking then ever.<br/>"},{"__typename":"Description","type":"COMPATIBILITY_NOTICE","value":"Offline play only<br/>Vibration function and trigger ef ms":["PS5"],"descriptions":[{"__typename":"Description","type":"SHORT","subType":"NONE","value":"\"My name...is Maria,\" the woman smiles, just like my late wife."},{"__typename":"Description","type":"LONG","subType":"NONE","value":"Having received a letter from his deceased wife,<br/>James heads to where they shared so many memories,<br/>in the hope of seeing her one more time: Silent Hill.<br/>There, by the lake, he finds a woman eerily similar to her...<br/><br/>\"My name...is Maria,\" the woman smiles. Her face, her voice... She's just like her.<br/><br/>Experience a master-class in psychological survival horror―lauded as the best in the series―on the latest hardware with chilling visuals and visceral sounds.<br/><br/>High-end Graphics and Sound<br/><br/>With ray tracing and other cutting-edge technical enhancements, the world of SILENT HILL and its unsettling ambiance is even realer than before.<br/>And with the inclusion of new, immersive soundscapes, you'll feel like you're standing in the thick of it.<br/><br/>Larger Environments<br/><br/>Explore locations and buildings that were once inaccessible, or are newly added in the remake.<br/>Enjoy the same acclaimed story, even while you experience the town of Silent Hill with fresh eyes across an expanded map.<br/><br/>Over-the-shoulder Camera<br/><br/>The remake moves from the original's fixed-camera viewpoints to an over-the-shoulder perspective, putting you closer to what James sees, for a more thrilling, more immersive experience as you explore the town and come face-to-face with monsters.<br/><br/>Evolved Combat Gameplay<br/><br/>Familiar weapons like the steel pipe and handgun make their return, but now with an updated combat system.<br/>Avoid attacks with carefully timed dodges, aim down sights, and more, making monster encounters more engaging and nerve-wracking then ever.<br/>"},{"__typename":"Description","type":"COMPATIBILITY_NOTICE","subType":"NONE","value":"Offline play only<br/>Vibration function an
