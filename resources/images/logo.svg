<?xml version="1.0" encoding="UTF-8"?>
<!--
    Logo Game Watcher — zdroj ikon (favicon, apple-touch-icon). Kresba odpovídá
    komponentě resources/js/Components/BrandLogo.vue, tady s pevnými barvami
    tokenů (_tokens.scss) a pozadím, protože ikona se zobrazuje mimo stránku.
    Atributy jsou přímo na prvcích — vykreslovač ImageMagicku je ze skupiny nedědí.

    @author Roman Hlaváček
    @created 2026-10-11
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
    <rect width="48" height="48" rx="6" fill="#070b16"/>
    <polygon points="24,5 40,14.25 40,33.75 24,43 8,33.75 8,14.25" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="20,16.5 32.5,24 20,31.5" fill="#06303a" stroke="#ff2bd6" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
