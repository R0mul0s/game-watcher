# Game Watcher — Docker Compose stack pro vývoj
#
# Aplikace:        http://localhost:54730
# MariaDB:         localhost:54731 (games / games)
# Vite dev server: http://localhost:54732 (jen při `npm run dev`)
#
# Porty 5471x má projekt Počasí, 5472x Letáky — oba můžou běžet současně.
# Verze PHP i MariaDB odpovídají produkci (shared hosting). Redis ani fronta
# tu nejsou — produkce je nemá.
#
# @author Roman Hlaváček
# @created 2026-10-11

name: game-watcher

services:
    app:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: games-app
        working_dir: /var/www/html
        # Kontejner běží pod www-data jako php-fpm workery — soubory vytvořené
        # přes `docker compose exec app …` tak web může přepsat.
        user: www-data
        volumes:
            - ./:/var/www/html
        # Porty jen na localhost — ne do sítě (DB má vývojová hesla)
        ports:
            - "127.0.0.1:54732:5173"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - games
        environment:
            # Composer i npm potřebují zapisovatelný domovský adresář.
            HOME: /tmp

    nginx:
        image: nginx:1.27-alpine
        container_name: games-nginx
        ports:
            - "127.0.0.1:54730:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - games

    db:
        image: mariadb:11.4
        container_name: games-db
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: games
            MARIADB_USER: games
            MARIADB_PASSWORD: games
        ports:
            - "127.0.0.1:54731:3306"
        volumes:
            - dbdata:/var/lib/mysql
            - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        # app startuje až s databází připravenou na spojení (skript je součástí image)
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - games

volumes:
    dbdata:

networks:
    games:
        driver: bridge
